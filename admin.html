<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>
    LHCC CMS Dashboard
  </title>

  <!-- TAB LOGO -->
  <link rel="icon" type="image/x-icon" href="logo.ico">

  <!-- TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      font-family:'Inter', sans-serif;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      background:#070707;
      overflow-x:hidden;
      color:white;
    }

    textarea{
      resize:none;
    }

    iframe{
      border:none;
    }

    .glass{
      backdrop-filter:blur(20px);
      background:rgba(255,255,255,0.05);
    }

    .card{

      background:#111111;
      border:1px solid rgba(255,255,255,0.08);

      border-radius:32px;

      padding:32px;

      box-shadow:
      0 20px 60px rgba(0,0,0,0.45);

    }

    .input{

      width:100%;
      margin-top:12px;

      background:#181818;
      border:1px solid rgba(255,255,255,0.08);

      color:white;

      padding:18px;
      border-radius:20px;

      outline:none;

    }

    .input:focus{

      border-color:#facc15;
      box-shadow:0 0 0 4px rgba(250,204,21,0.15);

    }

    .preview-image{
      width:100%;
      height:260px;
      object-fit:cover;
      border-radius:24px;
      margin-top:20px;
      border:1px solid rgba(255,255,255,0.08);
    }

    .glow{

      position:fixed;
      width:700px;
      height:700px;

      border-radius:999px;

      filter:blur(140px);

      z-index:0;
      pointer-events:none;

    }

    .gold-btn{

      background:#facc15;
      color:black;

      font-weight:900;

      transition:0.3s ease;

    }

    .gold-btn:hover{
      transform:scale(1.03);
    }

  </style>

</head>

<body>

  <!-- GLOW -->
  <div class="glow top-[-250px] left-[-250px] bg-yellow-400/10"></div>

  <div class="glow bottom-[-250px] right-[-250px] bg-yellow-500/10"></div>

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 border-b border-white/10 glass">

    <div class="max-w-[1700px] mx-auto px-6 py-5 flex justify-between items-center">

      <!-- LEFT -->
      <div>

        <h1 class="text-4xl font-black text-yellow-400">
          LHCC CMS
        </h1>

        <p class="text-zinc-400 text-sm uppercase tracking-[0.3em] mt-1">
          Lord of the Harvest Christian Church
        </p>

      </div>

      <!-- RIGHT -->
      <div class="flex gap-4">

        <a
          href="index.html"
          target="_blank"
          class="bg-white/5 border border-white/10 px-6 py-3 rounded-2xl hover:bg-white hover:text-black transition font-semibold"
        >
          Open Website
        </a>

        <button
          onclick="refreshPreview()"
          class="gold-btn px-6 py-3 rounded-2xl"
        >
          Refresh Preview
        </button>

      </div>

    </div>

  </nav>

  <!-- MAIN -->
  <main class="max-w-[1700px] mx-auto px-6 py-10 relative z-10">

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-10">

      <!-- LEFT -->
      <div class="space-y-10">

        <!-- WEBSITE SETTINGS -->
        <section class="card">

          <div class="mb-10">

            <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
              Church CMS
            </p>

            <h2 class="text-5xl font-black mt-4">
              Website Settings
            </h2>

            <p class="text-zinc-400 mt-4 text-lg">
              Manage church website contents and worship experience.
            </p>

          </div>

          <div class="space-y-6">

            <!-- CHURCH NAME -->
            <div>

              <label class="font-semibold">
                Church Name
              </label>

              <input
                id="churchName"
                type="text"
                class="input"
              />

            </div>

            <!-- SUBTITLE -->
            <div>

              <label class="font-semibold">
                Church Subtitle
              </label>

              <input
                id="churchSubtitle"
                type="text"
                class="input"
              />

            </div>

            <!-- HERO TITLE -->
            <div>

              <label class="font-semibold">
                Hero Title
              </label>

              <textarea
                id="heroTitle"
                rows="4"
                class="input"
              ></textarea>

            </div>

            <!-- HERO DESCRIPTION -->
            <div>

              <label class="font-semibold">
                Hero Description
              </label>

              <textarea
                id="heroDescription"
                rows="6"
                class="input"
              ></textarea>

            </div>

            <!-- HERO BG -->
            <div>

              <label class="font-semibold">
                Hero Background Image URL
              </label>

              <input
                id="heroBackground"
                type="text"
                class="input"
              />

            </div>

            <!-- SOCIAL LINKS -->
            <div class="grid md:grid-cols-3 gap-6">

              <div>

                <label class="font-semibold">
                  Facebook Link
                </label>

                <input
                  id="facebookLink"
                  type="text"
                  class="input"
                />

              </div>

              <div>

                <label class="font-semibold">
                  YouTube Link
                </label>

                <input
                  id="youtubeLink"
                  type="text"
                  class="input"
                />

              </div>

              <div>

                <label class="font-semibold">
                  Email Address
                </label>

                <input
                  id="emailLink"
                  type="text"
                  class="input"
                />

              </div>

            </div>

            <!-- ABOUT -->
            <div>

              <label class="font-semibold">
                About Title
              </label>

              <input
                id="aboutTitle"
                type="text"
                class="input"
              />

            </div>

            <div>

              <label class="font-semibold">
                About Description
              </label>

              <textarea
                id="aboutDescription"
                rows="5"
                class="input"
              ></textarea>

            </div>

            <!-- SERVICES -->
            <div class="grid md:grid-cols-2 gap-6">

              <div>

                <label class="font-semibold">
                  Sunday Service
                </label>

                <input
                  id="sundayService"
                  type="text"
                  class="input"
                />

              </div>

              <div>

                <label class="font-semibold">
                  Midweek Service
                </label>

                <input
                  id="midweekService"
                  type="text"
                  class="input"
                />

              </div>

            </div>

            <!-- FOOTER -->
            <div>

              <label class="font-semibold">
                Footer Text
              </label>

              <input
                id="footerText"
                type="text"
                class="input"
              />

            </div>

            <!-- LOGO -->
            <div>

              <label class="font-semibold">
                Upload Church Logo
              </label>

              <input
                id="logoInput"
                type="file"
                accept="image/*"
                onchange="previewLogo(event)"
                class="input"
              />

              <img
                id="logoPreview"
                class="preview-image hidden"
              />

            </div>

            <!-- SAVE -->
            <button
              onclick="updateWebsiteSettings()"
              class="gold-btn w-full py-5 rounded-2xl text-lg"
            >
              SAVE WEBSITE SETTINGS
            </button>

          </div>

        </section>

        <!-- CREATE SERMON -->
        <section class="card">

          <div class="mb-10">

            <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
              Sermons
            </p>

            <h2 class="text-5xl font-black mt-4">
              Publish Sermon
            </h2>

          </div>

          <div class="space-y-6">

            <input
              id="sermonTitle"
              type="text"
              placeholder="Sermon Title"
              class="input"
            />

            <input
              id="sermonCategory"
              type="text"
              placeholder="Category"
              class="input"
            />

            <input
              id="sermonVideo"
              type="text"
              placeholder="YouTube Link"
              class="input"
            />

            <input
              id="sermonImage"
              type="file"
              accept="image/*"
              class="input"
            />

            <button
              onclick="createSermon()"
              class="gold-btn w-full py-5 rounded-2xl text-lg"
            >
              PUBLISH SERMON
            </button>

          </div>

        </section>

        <!-- CREATE EVENT -->
        <section class="card">

          <div class="mb-10">

            <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
              Events
            </p>

            <h2 class="text-5xl font-black mt-4">
              Create Event
            </h2>

          </div>

          <div class="space-y-6">

            <input
              id="eventTitle"
              type="text"
              placeholder="Event Title"
              class="input"
            />

            <input
              id="eventDate"
              type="text"
              placeholder="June 25, 2026"
              class="input"
            />

            <textarea
              id="eventDescription"
              rows="5"
              placeholder="Event Description"
              class="input"
            ></textarea>

            <button
              onclick="createEvent()"
              class="gold-btn w-full py-5 rounded-2xl text-lg"
            >
              PUBLISH EVENT
            </button>

          </div>

        </section>

        <!-- CREATE MINISTRY -->
        <section class="card">

          <div class="mb-10">

            <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
              Ministries
            </p>

            <h2 class="text-5xl font-black mt-4">
              Create Ministry
            </h2>

          </div>

          <div class="space-y-6">

            <input
              id="ministryIcon"
              type="text"
              placeholder="🔥"
              class="input"
            />

            <input
              id="ministryTitle"
              type="text"
              placeholder="Youth Ministry"
              class="input"
            />

            <textarea
              id="ministryDescription"
              rows="5"
              placeholder="Ministry Description"
              class="input"
            ></textarea>

            <button
              onclick="createMinistry()"
              class="gold-btn w-full py-5 rounded-2xl text-lg"
            >
              PUBLISH MINISTRY
            </button>

          </div>

        </section>

      </div>

      <!-- RIGHT -->
      <div class="sticky top-28 h-[90vh]">

        <div class="bg-[#111111] border border-white/10 rounded-[2rem] overflow-hidden h-full shadow-2xl">

          <!-- TOP -->
          <div class="flex items-center justify-between px-6 py-5 border-b border-white/10">

            <div>

              <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
                Live Preview
              </p>

              <h2 class="text-3xl font-black mt-2">
                Website Preview
              </h2>

            </div>

            <button
              onclick="refreshPreview()"
              class="gold-btn px-6 py-3 rounded-2xl"
            >
              Refresh
            </button>

          </div>

          <!-- IFRAME -->
          <iframe
            id="previewFrame"
            src="index.html"
            class="w-full h-full bg-white"
          ></iframe>

        </div>

      </div>

    </div>

  </main>

  <!-- ADMIN JS -->
  <script src="admin.js"></script>

</body>
</html>
