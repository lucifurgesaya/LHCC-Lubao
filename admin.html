<body class="min-h-screen text-white bg-[#070707]">

  <!-- BACKGROUND GLOW -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">

    <div class="absolute top-[-200px] left-[-200px] w-[700px] h-[700px] bg-yellow-400/10 blur-[140px] rounded-full"></div>

    <div class="absolute bottom-[-200px] right-[-200px] w-[700px] h-[700px] bg-yellow-500/10 blur-[140px] rounded-full"></div>

  </div>

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 border-b border-white/10 bg-black/40 backdrop-blur-2xl">

    <div class="max-w-[1700px] mx-auto px-6 py-5 flex justify-between items-center">

      <!-- LEFT -->
      <div>

        <h1 class="text-4xl font-black tracking-tight text-yellow-400">
          LHCC CMS
        </h1>

        <p class="text-zinc-400 text-sm mt-1 uppercase tracking-[0.3em]">
          Lord of the Harvest Christian Church
        </p>

      </div>

      <!-- RIGHT -->
      <div class="flex gap-4">

        <a
          href="index.html"
          target="_blank"
          class="bg-white/10 border border-white/10 px-6 py-3 rounded-2xl hover:bg-white hover:text-black transition font-semibold"
        >
          Open Website
        </a>

        <button
          onclick="refreshPreview()"
          class="bg-yellow-400 text-black px-6 py-3 rounded-2xl hover:scale-105 transition font-bold"
        >
          Refresh Preview
        </button>

      </div>

    </div>

  </nav>

  <!-- MAIN -->
  <main class="max-w-[1700px] mx-auto px-6 py-10 relative z-10">

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-10">

      <!-- LEFT -->
      <div class="space-y-10">

        <!-- WEBSITE SETTINGS -->
        <section class="bg-[#111111] border border-white/10 rounded-[2rem] p-10 shadow-2xl">

          <div class="mb-10">

            <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
              Church CMS
            </p>

            <h2 class="text-5xl font-black mt-4">
              Website Settings
            </h2>

            <p class="text-zinc-400 mt-4 text-lg">
              Manage church website contents and livestream experience.
            </p>

          </div>

          <div class="space-y-6">

            <input
              id="churchName"
              type="text"
              placeholder="Church Name"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            />

            <input
              id="churchSubtitle"
              type="text"
              placeholder="Church Subtitle"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            />

            <textarea
              id="heroTitle"
              rows="4"
              placeholder="Hero Title"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            ></textarea>

            <textarea
              id="heroDescription"
              rows="6"
              placeholder="Hero Description"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            ></textarea>

            <input
              id="heroBackground"
              type="text"
              placeholder="Hero Background Image URL"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            />

            <!-- SOCIAL LINKS -->
            <div class="grid md:grid-cols-3 gap-6">

              <input
                id="facebookLink"
                type="text"
                placeholder="Facebook Link"
                class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
              />

              <input
                id="youtubeLink"
                type="text"
                placeholder="YouTube Link"
                class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
              />

              <input
                id="emailLink"
                type="text"
                placeholder="Email Address"
                class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
              />

            </div>

            <textarea
              id="aboutTitle"
              rows="2"
              placeholder="About Title"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            ></textarea>

            <textarea
              id="aboutDescription"
              rows="5"
              placeholder="About Description"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            ></textarea>

            <div class="grid md:grid-cols-2 gap-6">

              <input
                id="sundayService"
                type="text"
                placeholder="Sunday Service Time"
                class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
              />

              <input
                id="midweekService"
                type="text"
                placeholder="Midweek Service Time"
                class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
              />

            </div>

            <input
              id="footerText"
              type="text"
              placeholder="Footer Text"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            />

            <!-- LOGO -->
            <div>

              <label class="block text-yellow-400 font-semibold mb-3">
                Upload Church Logo
              </label>

              <input
                id="logoInput"
                type="file"
                accept="image/*"
                onchange="previewLogo(event)"
                class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
              />

              <img
                id="logoPreview"
                class="preview-image hidden"
              />

            </div>

            <button
              onclick="updateWebsiteSettings()"
              class="w-full bg-yellow-400 text-black py-5 rounded-2xl font-black text-lg hover:scale-[1.02] transition"
            >
              SAVE WEBSITE SETTINGS
            </button>

          </div>

        </section>

        <!-- CREATE SERMON -->
        <section class="bg-[#111111] border border-white/10 rounded-[2rem] p-10 shadow-2xl">

          <div class="mb-10">

            <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
              Sermons
            </p>

            <h2 class="text-5xl font-black mt-4">
              Publish Sermon
            </h2>

          </div>

          <div class="space-y-6">

            <input
              id="sermonTitle"
              type="text"
              placeholder="Sermon Title"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            />

            <input
              id="sermonCategory"
              type="text"
              placeholder="Category"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            />

            <input
              id="sermonVideo"
              type="text"
              placeholder="YouTube Link"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            />

            <input
              id="sermonImage"
              type="file"
              accept="image/*"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            />

            <button
              onclick="createSermon()"
              class="w-full bg-yellow-400 text-black py-5 rounded-2xl font-black text-lg hover:scale-[1.02] transition"
            >
              PUBLISH SERMON
            </button>

          </div>

        </section>

        <!-- CREATE EVENT -->
        <section class="bg-[#111111] border border-white/10 rounded-[2rem] p-10 shadow-2xl">

          <div class="mb-10">

            <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
              Events
            </p>

            <h2 class="text-5xl font-black mt-4">
              Create Event
            </h2>

          </div>

          <div class="space-y-6">

            <input
              id="eventTitle"
              type="text"
              placeholder="Event Title"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            />

            <input
              id="eventDate"
              type="text"
              placeholder="June 25, 2026"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            />

            <textarea
              id="eventDescription"
              rows="5"
              placeholder="Event Description"
              class="w-full bg-[#181818] border border-white/10 rounded-2xl p-5 text-white"
            ></textarea>

            <button
              onclick="createEvent()"
              class="w-full bg-yellow-400 text-black py-5 rounded-2xl font-black text-lg hover:scale-[1.02] transition"
            >
              PUBLISH EVENT
            </button>

          </div>

        </section>

      </div>

      <!-- RIGHT -->
      <div class="sticky top-28 h-[90vh]">

        <div class="bg-[#111111] border border-white/10 rounded-[2rem] overflow-hidden h-full shadow-2xl">

          <div class="flex items-center justify-between px-6 py-5 border-b border-white/10">

            <div>

              <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
                Live Preview
              </p>

              <h2 class="text-3xl font-black mt-2">
                Website Preview
              </h2>

            </div>

            <button
              onclick="refreshPreview()"
              class="bg-yellow-400 text-black px-6 py-3 rounded-2xl font-bold"
            >
              Refresh
            </button>

          </div>

          <iframe
            id="previewFrame"
            src="index.html"
            class="w-full h-full bg-white"
          ></iframe>

        </div>

      </div>

    </div>

  </main>

  <!-- ADMIN JS -->
  <script src="admin.js"></script>

</body>
