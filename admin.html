
<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="logo.ico">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>
    LHCC CMS Dashboard
  </title>

  <!-- TAB LOGO -->
  <link rel="icon" type="image/x-icon" href="logo.ico">

  <!-- TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      font-family:'Inter', sans-serif;
    }

    body{
      background:#0f0f0f;
      color:white;
      overflow-x:hidden;
    }

    .glass{
      backdrop-filter:blur(20px);
      background:rgba(255,255,255,0.04);
    }

    .card{

      background:#181818;
      border:1px solid rgba(255,255,255,0.08);

      border-radius:32px;

      padding:32px;
    }

    .input{

      width:100%;

      background:#101010;

      border:1px solid rgba(255,255,255,0.08);

      padding:18px;

      border-radius:20px;

      color:white;

      outline:none;

      transition:0.3s;

    }

    .input:focus{

      border-color:#facc15;
      box-shadow:0 0 0 3px rgba(250,204,21,0.2);

    }

    .gold-btn{

      background:#facc15;
      color:black;
      font-weight:800;

      transition:0.3s;
    }

    .gold-btn:hover{

      transform:translateY(-2px) scale(1.02);

    }

    .preview-image{

      width:100%;
      height:260px;

      object-fit:cover;

      border-radius:24px;

      margin-top:20px;

      border:1px solid rgba(255,255,255,0.1);

    }

    iframe{
      border:none;
    }

  </style>

</head>

<body>

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 border-b border-white/10 glass">

    <div class="max-w-[1800px] mx-auto px-6 py-5 flex justify-between items-center">

      <div>

        <p class="uppercase tracking-[0.4em] text-yellow-400 text-xs">
          Lord of the Harvest Christian Church
        </p>

        <h1 class="text-4xl font-black mt-2">
          CMS Dashboard
        </h1>

      </div>

      <div class="flex gap-4">

        <a
          href="index.html"
          target="_blank"
          class="bg-white/10 border border-white/10 px-6 py-3 rounded-2xl hover:bg-white/20 transition"
        >
          Open Website
        </a>

        <button
          onclick="refreshPreview()"
          class="gold-btn px-6 py-3 rounded-2xl"
        >
          Refresh Preview
        </button>

      </div>

    </div>

  </nav>

  <!-- MAIN -->
  <main class="max-w-[1800px] mx-auto px-6 py-10">

    <div class="grid xl:grid-cols-2 gap-10">

      <!-- LEFT -->
      <div class="space-y-10">

        <!-- WEBSITE SETTINGS -->
        <section class="card">

          <div class="mb-10">

            <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
              Website Settings
            </p>

            <h2 class="text-5xl font-black mt-4">
              Church Website CMS
            </h2>

          </div>

          <div class="space-y-6">

            <input
              id="churchName"
              type="text"
              placeholder="Church Name"
              class="input"
            />

            <input
              id="churchSubtitle"
              type="text"
              placeholder="Church Subtitle"
              class="input"
            />

            <textarea
              id="heroTitle"
              rows="4"
              placeholder="Hero Title"
              class="input"
            ></textarea>

            <textarea
              id="heroDescription"
              rows="6"
              placeholder="Hero Description"
              class="input"
            ></textarea>

            <input
              id="aboutTitle"
              type="text"
              placeholder="About Title"
              class="input"
            />

            <textarea
              id="aboutDescription"
              rows="6"
              placeholder="About Description"
              class="input"
            ></textarea>

            <div class="grid md:grid-cols-2 gap-6">

              <input
                id="sundayService"
                type="text"
                placeholder="Sunday Service"
                class="input"
              />

              <input
                id="midweekService"
                type="text"
                placeholder="Midweek Service"
                class="input"
              />

            </div>

            <input
              id="facebookLink"
              type="text"
              placeholder="Facebook Link"
              class="input"
            />

            <input
              id="youtubeLink"
              type="text"
              placeholder="YouTube Link"
              class="input"
            />

            <input
              id="emailLink"
              type="text"
              placeholder="Email Link"
              class="input"
            />

            <input
              id="heroBackground"
              type="text"
              placeholder="Hero Background Image URL"
              class="input"
            />

            <input
              id="footerText"
              type="text"
              placeholder="Footer Text"
              class="input"
            />

            <!-- LOGO -->
            <div>

              <label class="text-sm text-zinc-400">
                Upload Logo
              </label>

              <input
                id="logoInput"
                type="file"
                accept="image/*"
                onchange="previewLogo(event)"
                class="input mt-3"
              />

              <img
                id="logoPreview"
                class="preview-image hidden"
              />

            </div>

            <button
              type="button"
              onclick="updateWebsiteSettings()"
              class="gold-btn w-full py-5 rounded-2xl text-lg"
            >
              SAVE WEBSITE SETTINGS
            </button>

          </div>

        </section>

        <!-- SERMONS -->
        <section class="card">

          <div class="mb-10">

            <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
              Sermons
            </p>

            <h2 class="text-5xl font-black mt-4">
              Publish Sermon
            </h2>

          </div>

          <div class="space-y-6">

            <input
              id="sermonTitle"
              type="text"
              placeholder="Sermon Title"
              class="input"
            />

            <input
              id="sermonCategory"
              type="text"
              placeholder="Category"
              class="input"
            />

            <input
              id="sermonVideo"
              type="text"
              placeholder="YouTube Link"
              class="input"
            />

            <input
              id="sermonImage"
              type="file"
              accept="image/*"
              class="input"
            />

            <button
              type="button"
              onclick="createSermon()"
              class="gold-btn w-full py-5 rounded-2xl text-lg"
            >
              PUBLISH SERMON
            </button>

          </div>

          <div class="mt-10">

            <h3 class="text-2xl font-black mb-6">
              Published Sermons
            </h3>

            <div
              id="sermonsAdminList"
              class="grid gap-6"
            ></div>

          </div>

        </section>

        <!-- EVENTS -->
        <section class="card">

          <div class="mb-10">

            <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
              Events
            </p>

            <h2 class="text-5xl font-black mt-4">
              Create Event
            </h2>

          </div>

          <div class="space-y-6">

            <input
              id="eventTitle"
              type="text"
              placeholder="Event Title"
              class="input"
            />

            <input
              id="eventDate"
              type="text"
              placeholder="June 25, 2026"
              class="input"
            />

            <textarea
              id="eventDescription"
              rows="5"
              placeholder="Event Description"
              class="input"
            ></textarea>

    <button
  type="button"
  onclick="publishEvent()"
  class="gold-btn w-full py-5 rounded-2xl text-lg"
>
  PUBLISH EVENT
</button>
          </div>

          <div class="mt-10">

            <h3 class="text-2xl font-black mb-6">
              Published Events
            </h3>

            <div
              id="eventsAdminList"
              class="grid gap-6"
            ></div>

          </div>

        </section>

        <!-- MINISTRIES -->
        <section class="card">

          <div class="mb-10">

            <p class="uppercase tracking-[0.3em] text-yellow-400 text-sm">
              Ministries
            </p>

            <h2 class="text-5xl font-black mt-4">
              Create Ministry
            </h2>

          </div>

          <div class="space-y-6">

            <input
              id="ministryIcon"
              type="text"
              placeholder="🔥"
              class="input"
            />

            <input
              id="ministryTitle"
              type="text"
              placeholder="Youth Ministry"
              class="input"
            />

            <textarea
              id="ministryDescription"
              rows="5"
              placeholder="Ministry Description"
              class="input"
            ></textarea>

            <button
              type="button"
              onclick="createMinistry()"
              class="gold-btn w-full py-5 rounded-2xl text-lg"
            >
              PUBLISH MINISTRY
            </button>

          </div>

          <div class="mt-10">

            <h3 class="text-2xl font-black mb-6">
              Published Ministries
            </h3>

            <div
              id="ministriesAdminList"
              class="grid gap-6"
            ></div>

          </div>

        </section>

      </div>

      <!-- RIGHT -->
      <div class="sticky top-28 h-[92vh]">

        <div class="bg-[#181818] border border-white/10 rounded-[2rem] overflow-hidden h-full">

          <div class="flex items-center justify-between px-6 py-5 border-b border-white/10">

            <div>

              <h2 class="text-2xl font-black">
                Live Website Preview
              </h2>

              <p class="text-zinc-400 text-sm">
                Real-time LHCC frontend preview
              </p>

            </div>

            <button
              onclick="refreshPreview()"
              class="gold-btn px-5 py-3 rounded-2xl"
            >
              Refresh
            </button>

          </div>

          <iframe
            id="previewFrame"
            src="index.html"
            class="w-full h-full bg-white"
          ></iframe>

        </div>

      </div>

    </div>

  </main>

  <!-- ADMIN JS -->
  <script src="admin.js"></script>

</body>
</html>
```
